<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="google" content="notranslate" />
<title>__PRODUCT_NAME__</title>
<!-- The shell (theme tokens, sidebar, orb, chat, composer, settings) and the
     view styles are two sheets on purpose: the shell can change its whole
     look without touching how a galaxy or a calendar is drawn. -->
<link rel="stylesheet" href="zeus.css" />
<link rel="stylesheet" href="views.css" />
<style>
  body.tv { cursor: none; }
  body.tv #eye { width: 44vh !important; height: 44vh !important; }
  body.tv footer.compose { display: none; }
  body.tv #stateLabel { font-size: 14px; letter-spacing: .5em; }
</style>
</head>
<body>

<!-- The boot veil covers the shell until ZEUS is genuinely ready to answer.
     Present in the markup from the first byte, dissolved by app.js on
     INTERACTIVE_READY. -->
<div id="bootVeil">
  <div class="bv-orb"></div>
  <div class="bv-brand">__PRODUCT_NAME__</div>
  <div class="bv-phase" id="bvPhase">ZEUS WIRD VERBUNDEN</div>
  <ul class="bv-systems">
    <li data-k="core">Kern</li>
    <li data-k="ai">Intelligenz</li>
    <li data-k="voice">Stimme</li>
  </ul>
</div>

<div id="app">
  <!-- The persistent sidebar: built by core/sidebar.js -->
  <aside id="sidebar" aria-label="Navigation"></aside>

  <div id="main">
    <header id="topbar">
      <button id="btnSidebar" title="Seitenleiste ein-/ausblenden">☰</button>
      <div id="topTitle">__PRODUCT_NAME__</div>
      <span class="spacer"></span>
      <button id="workPill" title="Was ZEUS gerade tut"><span class="dot"></span><span class="txt">Bereit</span><span class="n"></span></button>
      <span class="pill" id="connPill">verbinden</span>
      <button id="btnWorkspaceClose" hidden title="Zurück zum Chat (Esc)">Zurück zum Chat</button>
    </header>

    <main class="presence">
      <div id="stage">
        <div id="orbWrap"><canvas id="eye" width="380" height="380"></canvas></div>
        <div id="stateLabel" data-cat="blue">offline</div>
        <div id="heroLine">Was möchtest du wissen oder erledigen?</div>
        <div id="detail"></div>
        <div id="readiness"><span data-stage="UI_READY"></span><span data-stage="CORE_READY"></span><span data-stage="AI_READY" class="ai"></span><span data-stage="VOICE_READY"></span></div>
      </div>
      <div id="log"></div>
    </main>

    <main class="workspace">
      <section class="pane">
        <div class="pane-head">
          <h2 id="workspaceTitle">Workspace</h2>
          <div id="breadcrumb"></div>
        </div>
        <div id="workspacePane"></div>
      </section>
      <aside class="inspector" id="inspector">
        <header><strong id="inspectorTitle">Details</strong><button id="btnInspectorClose" title="Schließen">×</button></header>
        <div id="inspectorBody"></div>
      </aside>
    </main>

    <footer class="compose">
      <div class="composer glass edge-light">
        <textarea id="input" rows="1" placeholder="Frag __ASSISTANT_NAME__ etwas oder gib eine Aufgabe …" autofocus></textarea>
        <div class="compose-tools">
          <div id="perf" class="perf"></div>
          <span class="spacer"></span>
          <button class="icon-btn" id="btnMic" title="Spracheingabe">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <rect x="9" y="2" width="6" height="12" rx="3" /><path d="M5 11a7 7 0 0 0 14 0" /><path d="M12 18v4" />
            </svg>
          </button>
          <button class="icon-btn" id="btnSend" title="Senden">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M5 12l7-7 7 7" />
            </svg>
          </button>
        </div>
      </div>
      <div class="hint">Enter sendet · Shift+Enter neue Zeile · Esc unterbricht · Ctrl+K Befehle</div>
    </footer>
  </div>
</div>

<div id="workPanel" class="glass-strong" hidden></div>

<div id="palette">
  <div class="box">
    <input id="paletteInput" placeholder="Fragen, öffnen, suchen, ausführen …" autocomplete="off" spellcheck="false" />
    <div id="paletteList"></div>
    <div id="paletteFoot"><span>↑↓ wählen</span><span>↵ ausführen</span><span>Esc schließen</span></div>
  </div>
</div>

<div id="graphView">
  <div class="graph-bar">
    <input id="graphSearch" placeholder="Wissensgraph durchsuchen …" autocomplete="off" />
    <span class="graph-count" id="graphCount"></span>
    <button class="ghost" id="btnGraphClose">Zurück</button>
  </div>
  <canvas id="graphCanvas"></canvas>
  <div id="nodeCard" hidden>
    <div class="node-type" id="nodeType"></div>
    <h3 id="nodeTitle"></h3>
    <p id="nodeBody"></p>
    <div class="node-links" id="nodeLinks"></div>
    <div class="node-actions">
      <button class="ghost" id="btnAskAbout">__ASSISTANT_NAME__ fragen</button>
      <button class="ghost" id="btnReadAloud">Vorlesen</button>
      <button class="ghost" id="btnExpand">Erweitern</button>
    </div>
  </div>
</div>

<div id="panel">
  <header><strong id="panelTitle" style="flex:1">Korrigieren</strong><button class="ghost" id="btnClose">Schließen</button></header>
  <div id="panelBody"></div>
</div>

<div id="toasts"></div>

<script src="orb.js"></script>
<script src="graph.js"></script>
<script>
  window.JARVIS_TOKEN = "__JARVIS_TOKEN__";
</script>
<script type="module" src="app.js"></script>
</body>
</html>
