<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="google" content="notranslate" />
<title>__PRODUCT_NAME__</title>
<!-- The shell (tokens, sidebar, sphere, chat, composer, settings) and the
     view styles are two sheets on purpose: the shell can change its whole
     look without touching how a graph or a calendar is drawn. -->
<link rel="stylesheet" href="zeus.css" />
<link rel="stylesheet" href="views.css" />
<style>
  body.tv { cursor: none; }
  body.tv #eye { width: 62vh !important; }
  body.tv footer.compose { display: none; }
</style>
</head>
<body>

<!-- The boot veil covers the shell until ZEUS is genuinely ready to answer.
     Present in the markup from the first byte, dissolved by app.js on
     INTERACTIVE_READY. -->
<div id="bootVeil">
  <div class="bv-orb"></div>
  <div class="bv-brand">__PRODUCT_NAME__</div>
  <div class="bv-phase" id="bvPhase">ZEUS WIRD VERBUNDEN</div>
  <ul class="bv-systems">
    <li data-k="core">Kern</li>
    <li data-k="ai">Intelligenz</li>
    <li data-k="voice">Stimme</li>
  </ul>
</div>

<div id="app">
  <!-- The persistent sidebar: built by core/sidebar.js -->
  <aside id="sidebar" aria-label="Navigation"></aside>

  <div id="main">
    <header id="topbar">
      <button id="btnSidebar" class="tb-btn" title="Seitenleiste">
        <span class="i"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3" /><path d="M9.5 5v14" /></svg></span>
      </button>
      <div id="topTitle">__PRODUCT_NAME__</div>
      <button id="btnWorkspaceClose" hidden title="Zurück zum Chat (Esc)">Zurück</button>
      <span class="spacer"></span>
      <button id="btnSearch" class="tb-btn" title="Suchen und ausführen (Ctrl+K)">
        <span class="i"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="M20 20l-4.2-4.2" /></svg></span>
      </button>
      <button id="workPill" title="Was ZEUS gerade tut">
        <span class="i"><svg viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 4 12 2.5-6H21" /></svg></span>
        <span class="dot"></span><span class="txt">Bereit</span><span class="n"></span>
      </button>
      <span class="pill" id="connPill">verbinden</span>
      <button id="btnProfile" class="avatar" title="Einstellungen">R</button>
      <span class="winctl" id="winctl" hidden>
        <button id="btnWinMin" title="Minimieren"><span class="i"><svg viewBox="0 0 24 24"><path d="M6 12h12" /></svg></span></button>
        <button id="btnWinFull" title="Vollbild / Fenster (F11)"><span class="i"><svg viewBox="0 0 24 24"><path d="M8 4H4v4M16 4h4v4M4 16v4h4M20 16v4h-4" /></svg></span></button>
        <button id="btnWinClose" title="ZEUS schließen"><span class="i"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17" /></svg></span></button>
      </span>
    </header>

    <main class="presence">
      <div id="stage">
        <div id="orbWrap"><canvas id="eye" width="476" height="340"></canvas></div>
        <div class="hero">
          <div class="hero-brand">ZEUS</div>
          <div class="hero-sub">Dein persönliches KI-System</div>
          <div class="hero-rule"></div>
          <div class="hero-motto">Wissen. Klarheit. Fortschritt.</div>
        </div>
        <div id="stateLabel" data-state="offline" data-cat="blue">offline</div>
        <div id="detail"></div>
        <div id="readiness"><span data-stage="UI_READY"></span><span data-stage="CORE_READY"></span><span data-stage="AI_READY" class="ai"></span><span data-stage="VOICE_READY"></span></div>
      </div>
      <div id="log"></div>
    </main>

    <main class="workspace">
      <section class="pane">
        <div class="pane-head">
          <h2 id="workspaceTitle">Workspace</h2>
          <div id="breadcrumb"></div>
        </div>
        <div id="workspacePane"></div>
      </section>
      <aside class="inspector" id="inspector">
        <header><strong id="inspectorTitle">Details</strong><button id="btnInspectorClose" title="Schließen">×</button></header>
        <div id="inspectorBody"></div>
      </aside>
    </main>

    <footer class="compose">
      <div class="composer edge-light">
        <button class="icon-btn" id="btnPlus" title="Aktionen (Ctrl+K)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Wie kann ich dir helfen, Raphael …" autofocus></textarea>
        <div class="compose-tools">
          <div id="perf" class="perf"></div>
          <button class="icon-btn" id="btnMic" title="Spracheingabe">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <rect x="9" y="2.5" width="6" height="11.5" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0" /><path d="M12 17.5v3.5" />
            </svg>
          </button>
          <button class="icon-btn" id="btnSend" title="Senden">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" />
            </svg>
          </button>
        </div>
      </div>
      <div class="compose-foot"><span id="perfSpend" class="perf-spend"></span><span id="perfEstimate" class="perf-est" hidden></span></div>
    </footer>
  </div>
</div>

<div id="workPanel" class="glass-strong" hidden></div>

<div id="palette">
  <div class="box">
    <input id="paletteInput" placeholder="Fragen, öffnen, suchen, ausführen …" autocomplete="off" spellcheck="false" />
    <div id="paletteList"></div>
    <div id="paletteFoot"><span>↑↓ wählen</span><span>↵ ausführen</span><span>Esc schließen</span></div>
  </div>
</div>

<div id="graphView">
  <div class="graph-bar">
    <input id="graphSearch" placeholder="Wissensgraph durchsuchen …" autocomplete="off" />
    <span class="graph-count" id="graphCount"></span>
    <button class="ghost" id="btnGraphClose">Zurück</button>
  </div>
  <canvas id="graphCanvas"></canvas>
  <div id="nodeCard" hidden>
    <div class="node-type" id="nodeType"></div>
    <h3 id="nodeTitle"></h3>
    <p id="nodeBody"></p>
    <div class="node-links" id="nodeLinks"></div>
    <div class="node-actions">
      <button class="ghost" id="btnAskAbout">__ASSISTANT_NAME__ fragen</button>
      <button class="ghost" id="btnReadAloud">Vorlesen</button>
      <button class="ghost" id="btnExpand">Erweitern</button>
    </div>
  </div>
</div>

<div id="panel">
  <header><strong id="panelTitle" style="flex:1">Korrigieren</strong><button class="ghost" id="btnClose">Schließen</button></header>
  <div id="panelBody"></div>
</div>

<div id="toasts"></div>

<script src="orb.js"></script>
<script src="graph.js"></script>
<script>
  window.JARVIS_TOKEN = "__JARVIS_TOKEN__";
</script>
<script type="module" src="app.js"></script>
</body>
</html>
