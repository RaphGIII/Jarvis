<!--
  The Jarvis interface.

  Deliberately one file with no build step and no dependencies. The service is
  stdlib-only for the same reason, and a UI that needed npm to change would put
  the interface outside Jarvis' own development loop -- which the brief requires
  it to be inside ("Change the eye animation" must be an ordinary request).

  The eye is drawn on a canvas rather than assembled from SVG or DOM nodes,
  because it has to react continuously to state: a DOM-based iris would need a
  CSS animation per state and a class-swapping scheme to cross-fade them, while
  a canvas just interpolates its parameters towards whatever the current state
  asks for. Every state change is therefore a smooth transition rather than a cut.
-->
<title>__PRODUCT_NAME__</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  :root {
    --bg: #05070c;
    --bg-soft: #0a0f18;
    --line: #16202f;
    --text: #dce5f0;
    --dim: #6b7c93;
    --accent: #4fc3f7;
    --accent-warm: #ffb74d;
    --danger: #ff6b6b;
    --ok: #66d9a0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 "Segoe UI", -apple-system, system-ui, sans-serif;
    overflow: hidden;
  }

  #app {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100dvh;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* ---- top bar -------------------------------------------------- */

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 4px;
    font-size: 13px;
    color: var(--dim);
  }

  .brand {
    font-weight: 600;
    letter-spacing: 0.28em;
    color: var(--text);
    text-transform: uppercase;
    font-size: 12px;
  }

  .pill {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 11px;
    font-size: 11px;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  .pill.live { color: var(--ok); border-color: #1d4034; }
  .pill.warn { color: var(--accent-warm); border-color: #4a3a1c; }
  .pill.bad { color: var(--danger); border-color: #4a2020; }

  header .spacer { flex: 1; }

  button.ghost {
    background: none;
    border: 1px solid var(--line);
    color: var(--dim);
    border-radius: 8px;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
  }
  button.ghost:hover { color: var(--text); border-color: #24354b; }
  button.ghost[aria-pressed="true"] { color: var(--accent); border-color: #1d3a4d; }

  /* ---- stage ------------------------------------------------------ */

  main {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  #stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 8px 0 4px;
    flex: 0 0 auto;
    transition: transform .5s ease, opacity .4s ease;
  }


  #stateLabel {
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--dim);
    min-height: 16px;
  }

  #detail {
    font-size: 12px;
    color: var(--dim);
    opacity: .75;
    max-width: 620px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-height: 18px;
  }

  /* ---- hero and compact -------------------------------------------------
     Two presentation modes, one layout. There is no page switch and no second
     view: `.conversing` changes a handful of sizes and the browser interpolates
     between them, so the eye travels up and shrinks into the chat layout as one
     continuous movement. The transcript, the composer and the nav are the same
     elements throughout -- which is why the conversation view is unchanged from
     the one that already worked.

     The eye is a canvas, so shrinking the element only scales pixels; a
     ResizeObserver in app.js re-cuts the backing store as the transition runs,
     and it stays sharp at both ends. */

  #app:not(.conversing) main { justify-content: center; }
  #app:not(.conversing) #stage { flex: 1 1 auto; gap: 22px; }
  #app:not(.conversing) #log { flex: 0 0 auto; }
  #app:not(.conversing) #heroLine { opacity: .75; }

  #eye {
    width: clamp(260px, 40vh, 420px);
    height: clamp(260px, 40vh, 420px);
    display: block;
    transition: width .8s cubic-bezier(.55, 0, .18, 1),
                height .8s cubic-bezier(.55, 0, .18, 1);
  }

  /* Once a conversation starts, the eye steps back rather than dominating. */
  #app.conversing #eye { width: 108px; height: 108px; }
  #app.conversing #detail { display: none; }
  #app.conversing #heroLine { opacity: 0; height: 0; margin: 0; overflow: hidden; }

  #heroLine {
    font-size: 13px;
    color: var(--dim);
    letter-spacing: .02em;
    text-align: center;
    transition: opacity .45s ease, height .45s ease;
    height: 18px;
  }

  /* ---- transcript -------------------------------------------------- */

  #log {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 10px 4px 4px;
    min-height: 0;
    scrollbar-width: thin;
    scrollbar-color: #1b2636 transparent;
  }

  .turn { margin: 0 0 18px; display: flex; gap: 12px; }
  .turn .who {
    flex: 0 0 58px;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--dim);
    padding-top: 4px;
  }
  .turn .what { flex: 1; white-space: pre-wrap; word-break: break-word; }
  .turn.user .what { color: #a8bdd6; }
  .turn.jarvis .what { color: var(--text); }
  .turn.error .what { color: var(--danger); }
  .turn.note .what { color: var(--dim); font-size: 13px; font-style: italic; }
  /* A receipt reads as evidence, not as conversation: monospaced, boxed, and
     coloured by whether it was verified rather than by whether it was said. */
  .turn.receipt .what {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 12.5px; line-height: 1.55; color: var(--dim);
    border-left: 2px solid var(--dim); padding: 6px 0 6px 12px;
  }
  .turn.receipt .who { font-size: 11px; letter-spacing: .04em; }
  .turn.receipt.good .what { border-left-color: #3fb98a; color: #b6cfc4; }
  .turn.receipt.bad  .what { border-left-color: var(--danger); color: #d6b4b4; }
  .turn.receipt .check { margin-top: 4px; opacity: .85; }
  .turn.receipt .check.bad { color: var(--danger); opacity: 1; }

  .cursor {
    display: inline-block;
    width: 7px;
    height: 1.05em;
    background: var(--accent);
    vertical-align: text-bottom;
    animation: blink 1.1s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }

  /* ---- composer ---------------------------------------------------- */

  footer { padding: 12px 4px 20px; }

  .composer {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 12px;
    transition: border-color .2s;
  }
  .composer:focus-within { border-color: #24435c; }

  textarea {
    flex: 1;
    background: none;
    border: none;
    color: var(--text);
    font: inherit;
    resize: none;
    outline: none;
    max-height: 150px;
    line-height: 1.5;
  }
  textarea::placeholder { color: #3f4d61; }

  .icon-btn {
    background: none;
    border: none;
    color: var(--dim);
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    display: grid;
    place-items: center;
  }
  .icon-btn:hover { color: var(--text); background: #101725; }
  .icon-btn.active { color: var(--accent); }
  .icon-btn.recording { color: var(--danger); }

  .hint { color: #35435a; font-size: 11px; text-align: center; margin-top: 8px; }

  /* ---- panels ------------------------------------------------------ */

  #panel {
    position: fixed;
    inset: 0 0 0 auto;
    width: min(520px, 100%);
    background: #070b12;
    border-left: 1px solid var(--line);
    transform: translateX(100%);
    transition: transform .28s ease;
    display: flex;
    flex-direction: column;
    z-index: 20;
  }
  #panel.open { transform: none; }
  #panel header { padding: 16px 20px; border-bottom: 1px solid var(--line); }
  #panelBody { flex: 1; overflow: auto; padding: 16px 20px; }

  pre {
    background: #080d15;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    overflow: auto;
    font-size: 12px;
    color: #9fb4cc;
    font-family: "Cascadia Mono", Consolas, monospace;
  }

  .row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid #0e1520; font-size: 13px; }
  .row .k { color: var(--dim); }
  .row .v { color: var(--text); text-align: right; word-break: break-word; }

  .project {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .project:hover { border-color: #24354b; }
  .project .goal { color: var(--text); margin-bottom: 6px; font-size: 14px; }
  .project .meta { color: var(--dim); font-size: 11px; display: flex; gap: 12px; flex-wrap: wrap; }
  .badge { border-radius: 5px; padding: 1px 7px; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
  .badge.active { background: #12301f; color: var(--ok); }
  .badge.blocked { background: #341c1c; color: var(--danger); }
  .badge.done { background: #14283a; color: var(--accent); }
  .badge.idle { background: #1a1f28; color: var(--dim); }

  /* ---- activity ----------------------------------------------------- */

  .activity-controls {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--dim);
    padding-bottom: 12px; margin-bottom: 12px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .activity-empty { color: var(--dim); font-size: 13px; line-height: 1.6; }

  .act { border-left: 2px solid #1b2636; padding: 0 0 0 12px; margin-bottom: 10px; }
  .act.ok   { border-left-color: #3fb98a; }
  .act.bad  { border-left-color: var(--danger); }
  .act.warn { border-left-color: #c9a227; }
  .act.work { border-left-color: var(--accent); }
  .act.req  { border-left-color: #4a5b73; }
  .act.ans  { border-left-color: #2c3f57; }

  .act-head { display: flex; align-items: baseline; gap: 10px; padding: 3px 0; }
  .act-head.expandable { cursor: pointer; }
  .act-head.expandable:hover .act-sum { color: var(--text); }
  .act-tag {
    flex: 0 0 76px; font-size: 9.5px; letter-spacing: .11em;
    color: var(--dim); padding-top: 2px;
  }
  .act.ok   .act-tag { color: #3fb98a; }
  .act.bad  .act-tag { color: var(--danger); }
  .act.warn .act-tag { color: #c9a227; }
  .act.work .act-tag { color: var(--accent); }
  .act-sum {
    flex: 1; font-size: 12.5px; color: #9db0c8; line-height: 1.45;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .act-when { flex: 0 0 auto; font-size: 10.5px; color: #46566c; font-variant-numeric: tabular-nums; }

  .act-body {
    margin: 6px 0 4px 86px;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 11.5px; line-height: 1.6;
  }
  .act-kv { display: flex; gap: 10px; }
  .act-k { flex: 0 0 96px; color: #46566c; }
  .act-v { flex: 1; color: #9db0c8; word-break: break-word; }
  .act-checks-head { margin-top: 6px; flex: none; }
  .act-check { color: #7fb9a0; padding-left: 2px; }
  .act-check.bad { color: #d98a8a; }

  .steps { margin-top: 10px; }
  .step { display: flex; gap: 8px; padding: 4px 0; font-size: 12px; border-bottom: 1px solid #0c1218; }
  .step .phase { flex: 0 0 82px; color: var(--dim); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding-top: 2px; }
  .step .sum { flex: 1; color: #9db0c8; }
  .step.bad .sum { color: #d98a8a; }

  /* ---- knowledge graph --------------------------------------------- */

  #graphView {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 40%, #070d18 0%, #03050a 70%);
    display: none;
    z-index: 15;
  }
  #graphView.open { display: block; }
  #graphCanvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }

  .graph-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    z-index: 2;
  }
  .graph-bar input {
    flex: 1;
    max-width: 380px;
    background: rgba(10,16,26,.85);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    outline: none;
  }
  .graph-bar input:focus { border-color: #24435c; }
  .graph-count { color: var(--dim); font-size: 12px; }

  #nodeCard {
    position: absolute;
    right: 20px;
    bottom: 20px;
    width: min(360px, calc(100% - 40px));
    background: rgba(8,13,21,.94);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    z-index: 2;
    max-height: 60%;
    overflow: auto;
  }
  #nodeCard h3 { margin: 4px 0 8px; font-size: 15px; }
  #nodeCard p { margin: 0 0 12px; color: #9db0c8; font-size: 13px; white-space: pre-wrap; }
  .node-type { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
  .node-links { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .node-links button {
    background: #0d1420; border: 1px solid var(--line); color: #9db0c8;
    border-radius: 7px; padding: 4px 9px; font-size: 11px; cursor: pointer; font-family: inherit;
  }
  .node-links button:hover { color: var(--text); border-color: #24354b; }
  .node-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---- TV / kiosk ---------------------------------------------------
     Not a second UI: the same page with the pointer affordances removed and
     everything scaled for a screen read from across a room. A separate TV
     frontend would have to be kept in step with this one forever, and the
     first divergence would be a bug nobody notices until it is on the wall. */

  body.tv { font-size: 22px; }
  body.tv #app { max-width: 1600px; padding: 0 5vw; }
  body.tv header { padding: 2vh 0; font-size: 16px; }
  body.tv .brand { font-size: 18px; letter-spacing: .4em; }
  body.tv button.ghost, body.tv .composer, body.tv .hint { display: none; }
  body.tv #eye { width: 30vh; height: 30vh; }
  body.tv #app.conversing #eye { width: 18vh; height: 18vh; }
  body.tv #stateLabel { font-size: 15px; letter-spacing: .45em; }
  body.tv #detail { font-size: 18px; }
  body.tv .turn .who { flex-basis: 90px; font-size: 13px; }
  body.tv .turn { margin-bottom: 26px; }
  body.tv #log { padding-bottom: 4vh; }
  /* A TV has no cursor to hide, and a stray one parked over the picture is
     the most common way a kiosk looks broken. */
  body.tv, body.tv * { cursor: none; }

  @media (max-width: 620px) {
    #app { padding: 0 12px; }
    #eye { width: 150px; height: 150px; }
  }
</style>

<div id="app">
  <header>
    <span class="brand">__PRODUCT_NAME__</span>
    <span class="pill" id="connPill">connecting</span>
    <span class="pill" id="costPill" title="No metered channel is enabled">free</span>
    <span class="spacer"></span>
    <button class="ghost" id="btnProjects">Projects</button>
    <button class="ghost" id="btnGraph">Knowledge</button>
    <button class="ghost" id="btnActivity" aria-pressed="false">Activity</button>
    <button class="ghost" id="btnDiag">Diagnostics</button>
    <button class="ghost" id="btnNew" title="Clear the conversation">New</button>
  </header>

  <main>
    <div id="stage">
      <canvas id="eye" width="420" height="420"></canvas>
      <div id="stateLabel">idle</div>
      <div id="heroLine">Ask __ASSISTANT_NAME__ anything, or give it something to do.</div>
      <div id="detail"></div>
    </div>
    <div id="log"></div>
  </main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Talk to __ASSISTANT_NAME__…" autofocus></textarea>
      <button class="icon-btn" id="btnMic" title="Voice input">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <rect x="9" y="2" width="6" height="12" rx="3" /><path d="M5 11a7 7 0 0 0 14 0" /><path d="M12 18v4" />
        </svg>
      </button>
      <button class="icon-btn" id="btnSend" title="Send">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12h15M13 6l6 6-6 6" />
        </svg>
      </button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line · Esc interrupts</div>
  </footer>
</div>

<div id="graphView">
  <div class="graph-bar">
    <input id="graphSearch" placeholder="Search the knowledge graph…" autocomplete="off" />
    <span class="graph-count" id="graphCount"></span>
    <button class="ghost" id="btnGraphClose">Back</button>
  </div>
  <canvas id="graphCanvas"></canvas>
  <div id="nodeCard" hidden>
    <div class="node-type" id="nodeType"></div>
    <h3 id="nodeTitle"></h3>
    <p id="nodeBody"></p>
    <div class="node-links" id="nodeLinks"></div>
    <div class="node-actions">
      <button class="ghost" id="btnAskAbout">Ask __ASSISTANT_NAME__</button>
      <button class="ghost" id="btnReadAloud">Read aloud</button>
      <button class="ghost" id="btnExpand">Expand</button>
    </div>
  </div>
</div>

<div id="panel">
  <header style="display:flex;align-items:center;gap:12px">
    <strong id="panelTitle" style="flex:1">Diagnostics</strong>
    <button class="ghost" id="btnClose">Close</button>
  </header>
  <div id="panelBody"></div>
</div>

<script src="eye.js"></script>
<script src="graph.js"></script>
<script src="app.js"></script>
<script>
  window.JARVIS_TOKEN = "__JARVIS_TOKEN__";
  startJarvis();
</script>
