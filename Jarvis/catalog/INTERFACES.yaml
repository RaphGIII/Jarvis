    - name: HostProbe
      doc: Reads what hardware is actually present, degrading gracefully.
      methods:
      - def detect(self) -> HostInfo
      - def detect_gpus(self) -> list[GpuInfo]
    - name: GpuUsageMonitor
      doc: What the GPU is doing *right now*, cheap enough to put on a UI poll.
      methods:
      - def snapshot(self) -> dict[str, Any]
      - def refresh(self) -> dict[str, Any]
    - name: ContextMeasurement
      doc: One real generation at one candidate context size.
      methods:
      - def to_dict(self) -> dict[str, Any]
    - name: ContextBenchmark
      doc: Runs real generations at candidate context sizes and records the cost.
      methods:
      - 'def measure(self, spec: ModelSpec, context_window: int, *, max_tokens: int=96) -> ContextMeasurement'
      - 'def sweep(self, spec: ModelSpec, candidates: list[int], *, max_tokens: int=96) -> list[ContextMeasurement]'
    - name: ResourcePolicy
      doc: The settings Jarvis will actually run with, plus why.
      methods:
      - def to_dict(self) -> dict[str, Any]
      - 'def from_dict(cls, data: dict[str, Any]) -> ''ResourcePolicy'''
      - 'def apply_to(self, catalog: ModelCatalog) -> ModelCatalog'
      - 'def default_for(cls, host: HostInfo) -> ''ResourcePolicy'''
    - name: ResourceTuner
      doc: Benchmarks the host and produces a :class:`ResourcePolicy`.
      methods:
      - 'def tune(self, *, tiers: list[ModelTier] | None=None, candidates: list[int] | None=None, min_tokens_per_second: float=3.0)
        -> ResourcePolicy'
    - name: ResourcePolicyStore
      doc: Persists the tuned policy so tuning happens once, not every start.
      methods:
      - def load(self) -> ResourcePolicy | None
      - 'def save(self, policy: ResourcePolicy) -> Path'
      - 'def load_or_default(self, host: HostInfo | None=None) -> ResourcePolicy'
    functions:
    - signature: 'def reserved_vram_mib(host: HostInfo) -> int'
      doc: VRAM Jarvis refuses to consume, so the desktop stays usable.
