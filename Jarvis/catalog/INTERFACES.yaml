      methods: []
    - name: DevelopmentalLearningLoop
      doc: observe -> encode -> predict/rank -> act -> store -> update.
      methods:
      - 'def choose_action(self, candidate_actions: list[CandidateAction]) -> CandidateAction'
      - 'def record_experience(self, observation: Any, action: Any, reward_signal: RewardSignal, next_observation: Any, done:
        bool, *, success: bool=False, metadata: dict[str, Any] | None=None) -> LearningLoopTrace'
